# FreeRADIUS 3.2 virtual server; do not enable another listener on these ports.
# Set EA_RADIUS_REST_SECRET in FreeRADIUS's service environment to the same
# random value as the backend's RADIUS_REST_SECRET.
server ea_hotspot {
    listen {
        type = auth
        ipaddr = *
        port = 1812
    }
    listen {
        type = acct
        ipaddr = *
        port = 1813
    }
    authorize {
        update request {
            Tmp-String-0 := "%{client:shortname}"
        }
        update control {
            REST-HTTP-Header := "Authorization: Bearer $ENV{EA_RADIUS_REST_SECRET}"
        }
        ea_rest {
            fail = 1
            invalid = 1
            reject = 1
            userlock = 1
            notfound = 1
        }
        if (!(ok || updated)) {
            reject
        }
        chap
        pap
    }
    authenticate {
        Auth-Type PAP {
            pap
        }
        Auth-Type CHAP {
            chap
        }
    }
    post-auth {
        update control {
            REST-HTTP-Header := "Authorization: Bearer $ENV{EA_RADIUS_REST_SECRET}"
        }
        ea_rest {
            fail = 1
            invalid = 1
            reject = 1
            userlock = 1
            notfound = 1
        }
        if (!(ok || updated)) {
            reject
        }
        Post-Auth-Type REJECT {
            # No activation on a failed password or rejected authorization.
        }
    }
    accounting {
        update request {
            Tmp-String-0 := "%{client:shortname}"
        }
        update control {
            REST-HTTP-Header := "Authorization: Bearer $ENV{EA_RADIUS_REST_SECRET}"
        }
        ea_rest {
            fail = 1
            invalid = 1
            reject = 1
            userlock = 1
            notfound = 1
        }
        if (!(ok || updated)) {
            # Do not acknowledge a failed ledger write; let the NAS retry.
            do_not_respond
        }
    }
}
