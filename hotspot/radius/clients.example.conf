# Each shortname MUST match its towns.json ID. Use each router's VPN source IP.
# Replace these example secrets independently; they are not the REST secret.
client first_town {
    ipaddr = 10.20.0.1
    shortname = default
    secret = REPLACE_WITH_RANDOM_ROUTER_ONE_SECRET
    require_message_authenticator = yes
}
client second_town {
    ipaddr = 10.20.0.2
    shortname = second-town
    secret = REPLACE_WITH_RANDOM_ROUTER_TWO_SECRET
    require_message_authenticator = yes
}
