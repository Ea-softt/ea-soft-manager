# FreeRADIUS 3.2 module: install as mods-available/ea_rest and enable it.
# Requests use the built-in JSON encoder. Never interpolate credentials into JSON.
rest ea_rest {
    connect_uri = "http://127.0.0.1:3000"
    authorize {
        uri = "${..connect_uri}/api/internal/radius/authorize"
        method = post
        body = json
        timeout = 3
    }
    post-auth {
        uri = "${..connect_uri}/api/internal/radius/post-auth"
        method = post
        body = json
        timeout = 3
    }
    accounting {
        uri = "${..connect_uri}/api/internal/radius/accounting"
        method = post
        body = json
        timeout = 3
    }
    pool {
        start = 0
        min = 0
        max = 16
        spare = 2
        uses = 0
        retry_delay = 5
        lifetime = 0
        idle_timeout = 60
    }
}
